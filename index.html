<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CyberDine | Telegram Mini App</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #0b0d14;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    /* UIverse Glass Card */
    .glass-card {
      background: rgba(26, 30, 44, 0.6);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 18px;
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .glass-card:active {
      transform: scale(0.98);
    }

    /* UIverse Shimmer Button */
    .uiverse-btn {
      position: relative;
      font-weight: 700;
      color: #fff;
      background: #111;
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: all 0.2s ease;
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.3);
    }
    .uiverse-btn::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(transparent, transparent, transparent, #6366f1, #a855f7, #ec4899);
      animation: rotate-border 3s linear infinite;
      z-index: 0;
    }
    .uiverse-btn::after {
      content: '';
      position: absolute;
      inset: 2px;
      background: #121520;
      border-radius: 12px;
      z-index: 1;
      transition: all 0.2s ease;
    }
    .uiverse-btn:active {
      transform: scale(0.97);
    }
    .uiverse-btn span {
      position: relative;
      z-index: 2;
    }
    @keyframes rotate-border {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Hide scrollbars */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="p-4 pb-28 no-scrollbar select-none">

  <!-- Header Section -->
  <header class="flex items-center justify-between mb-5">
    <div class="flex items-center gap-3">
      <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-purple-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-purple-500/30">
        <span class="text-xl">⚡</span>
      </div>
      <div>
        <h1 class="text-lg font-bold tracking-tight text-white flex items-center gap-1.5">
          CyberDine
          <span class="text-[10px] uppercase tracking-wider px-2 py-0.5 rounded-full bg-purple-500/20 text-purple-400 font-bold border border-purple-500/30">Mini App</span>
        </h1>
        <p class="text-xs text-slate-400" id="user-greeting">Привет, Гость 👋</p>
      </div>
    </div>
    <button onclick="toggleCartModal()" class="relative p-2.5 rounded-xl bg-white/5 border border-white/10 active:scale-95 transition-all">
      <svg class="w-5 h-5 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
      <span id="cart-badge" class="hidden absolute -top-1.5 -right-1.5 w-5 h-5 bg-gradient-to-r from-pink-500 to-purple-600 rounded-full text-[10px] font-bold text-white flex items-center justify-center shadow-md">0</span>
    </button>
  </header>

  <!-- Categories Horizontal Slider -->
  <nav class="flex items-center gap-2 overflow-x-auto no-scrollbar mb-6 pb-1">
    <button onclick="filterCategory('all')" class="cat-pill active px-4 py-2 rounded-xl text-xs font-semibold bg-purple-600 text-white shadow-md shadow-purple-600/30 transition-all flex items-center gap-1.5 whitespace-nowrap">
      <span>🔥</span> Все
    </button>
    <button onclick="filterCategory('burgers')" class="cat-pill px-4 py-2 rounded-xl text-xs font-semibold bg-white/5 text-slate-300 border border-white/5 transition-all flex items-center gap-1.5 whitespace-nowrap">
      <span>🍔</span> Бургеры
    </button>
    <button onclick="filterCategory('coffee')" class="cat-pill px-4 py-2 rounded-xl text-xs font-semibold bg-white/5 text-slate-300 border border-white/5 transition-all flex items-center gap-1.5 whitespace-nowrap">
      <span>☕</span> Кофе
    </button>
    <button onclick="filterCategory('desserts')" class="cat-pill px-4 py-2 rounded-xl text-xs font-semibold bg-white/5 text-slate-300 border border-white/5 transition-all flex items-center gap-1.5 whitespace-nowrap">
      <span>🍰</span> Десерты
    </button>
  </nav>

  <!-- Products Grid -->
  <main class="grid grid-cols-2 gap-3.5" id="products-grid">
    <!-- Items rendered dynamically via JS -->
  </main>

  <!-- Floating Sticky Bottom Cart Bar -->
  <div id="floating-bar" class="fixed bottom-4 left-4 right-4 max-w-md mx-auto hidden z-40">
    <div class="uiverse-btn w-full p-4 flex items-center justify-between" onclick="toggleCartModal()">
      <span class="flex items-center gap-3">
        <span class="w-7 h-7 rounded-lg bg-purple-500/30 flex items-center justify-center text-xs font-bold text-purple-300" id="floating-count">1</span>
        <span class="text-sm font-bold">Оформить заказ</span>
      </span>
      <span class="text-sm font-extrabold text-purple-300" id="floating-price">0 ₽</span>
    </div>
  </div>

  <!-- Cart Modal Bottom Drawer -->
  <div id="cart-drawer" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex flex-col justify-end transition-opacity duration-300">
    <div class="bg-[#121520] border-t border-white/10 rounded-t-3xl p-6 max-h-[85vh] flex flex-col shadow-2xl">
      <div class="w-12 h-1.5 bg-white/20 rounded-full mx-auto mb-4"></div>
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-bold">Ваша корзина</h2>
        <button onclick="toggleCartModal()" class="text-slate-400 p-1">✕</button>
      </div>

      <!-- Cart Items List -->
      <div class="overflow-y-auto no-scrollbar flex-1 space-y-3 mb-4" id="cart-items-container">
        <!-- Cart items rendered via JS -->
      </div>

      <!-- Total & Submit -->
      <div class="pt-4 border-t border-white/10">
        <div class="flex justify-between items-center mb-4">
          <span class="text-sm text-slate-400">Итого к оплате:</span>
          <span class="text-xl font-black text-white" id="modal-total-price">0 ₽</span>
        </div>
        <button onclick="submitOrder()" class="uiverse-btn w-full py-4 text-center">
          <span class="text-sm font-bold tracking-wide">Подтвердить в Telegram 🚀</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    // Initialize Telegram WebApp
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.initDataUnsafe?.user) {
        document.getElementById('user-greeting').textContent = `Привет, ${tg.initDataUnsafe.user.first_name}! 👋`;
      }
    }

    function triggerHaptic(type = 'medium') {
      if (tg?.HapticFeedback) {
        tg.HapticFeedback.impactOccurred(type);
      }
    }

    const PRODUCTS = [
      {
        id: 1,
        category: 'burgers',
        title: 'Cyber Truffle Burger',
        desc: 'Мраморная говядина, трюфельный соус, чеддер',
        price: 520,
        img: 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=500&h=500&q=80'
      },
      {
        id: 2,
        category: 'burgers',
        title: 'Neon Smash Double',
        desc: 'Двойная котлета, соленые огурчики, бекон',
        price: 480,
        img: 'https://images.unsplash.com/photo-1586190848861-99aa4a171e90?auto=format&fit=crop&w=500&h=500&q=80'
      },
      {
        id: 3,
        category: 'coffee',
        title: 'Nitro Cold Brew',
        desc: 'Холодный азотный кофе с плотной крема',
        price: 290,
        img: 'https://images.unsplash.com/photo-1517701550927-30cf4ba1dba5?auto=format&fit=crop&w=500&h=500&q=80'
      },
      {
        id: 4,
        category: 'coffee',
        title: 'Pistachio Cyber Latte',
        desc: 'Фисташковый урбеч, эспрессо, овсяное молоко',
        price: 340,
        img: 'https://images.unsplash.com/photo-1541167760496-1628856ab772?auto=format&fit=crop&w=500&h=500&q=80'
      },
      {
        id: 5,
        category: 'desserts',
        title: 'Matcha Basque Cake',
        desc: 'Карамелизированная корочка, нежный крем',
        price: 380,
        img: 'https://images.unsplash.com/photo-1533134242443-d4fd215305ad?auto=format&fit=crop&w=500&h=500&q=80'
      },
      {
        id: 6,
        category: 'desserts',
        title: 'French Choux Cream',
        desc: 'Заварной шу с фундучным пралине',
        price: 310,
        img: 'https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=500&h=500&q=80'
      }
    ];

    let cart = {}; // { productId: count }
    let currentCategory = 'all';

    function renderProducts() {
      const grid = document.getElementById('products-grid');
      grid.innerHTML = '';

      const filtered = currentCategory === 'all' 
        ? PRODUCTS 
        : PRODUCTS.filter(p => p.category === currentCategory);

      filtered.forEach(p => {
        const count = cart[p.id] || 0;
        const card = document.createElement('div');
        card.className = 'glass-card p-3 flex flex-col justify-between h-full';
        card.innerHTML = `
          <div class="flex-1 flex flex-col">
            <div class="w-full aspect-square rounded-xl overflow-hidden mb-2.5 relative bg-slate-800/60 border border-white/5">
              <img src="${p.img}" alt="${p.title}" class="w-full h-full object-cover block">
              <div class="absolute top-2 right-2 px-2 py-0.5 rounded-lg bg-black/70 backdrop-blur-md text-[11px] font-extrabold text-white border border-white/10 shadow-lg">
                ${p.price} ₽
              </div>
            </div>
            <h3 class="text-xs font-bold text-white leading-snug mb-1 line-clamp-1">${p.title}</h3>
            <p class="text-[10px] text-slate-400 line-clamp-2 leading-relaxed mb-3 flex-1">${p.desc}</p>
          </div>

          <div class="pt-2 border-t border-white/5">
            ${count === 0 ? `
              <button onclick="addToCart(${p.id})" class="w-full py-2 rounded-xl bg-purple-600/30 hover:bg-purple-600/50 border border-purple-500/40 text-purple-300 text-xs font-bold active:scale-95 transition-all">
                + Добавить
              </button>
            ` : `
              <div class="w-full flex items-center justify-between bg-white/5 rounded-xl p-1 border border-white/10">
                <button onclick="decreaseCart(${p.id})" class="w-7 h-7 rounded-lg bg-white/10 text-white font-bold flex items-center justify-center active:scale-90 transition-all">-</button>
                <span class="text-xs font-extrabold text-white">${count}</span>
                <button onclick="addToCart(${p.id})" class="w-7 h-7 rounded-lg bg-purple-600 text-white font-bold flex items-center justify-center active:scale-90 transition-all">+</button>
              </div>
            `}
          </div>
        `;
        grid.appendChild(card);
      });

      updateCartBars();
    }

    function addToCart(id) {
      cart[id] = (cart[id] || 0) + 1;
      triggerHaptic('light');
      renderProducts();
    }

    function decreaseCart(id) {
      if (cart[id] > 1) {
        cart[id]--;
      } else {
        delete cart[id];
      }
      triggerHaptic('light');
      renderProducts();
    }

    function filterCategory(cat) {
      currentCategory = cat;
      triggerHaptic('selection');
      document.querySelectorAll('.cat-pill').forEach(btn => {
        btn.classList.remove('bg-purple-600', 'text-white', 'shadow-purple-600/30');
        btn.classList.add('bg-white/5', 'text-slate-300');
      });
      event.currentTarget.classList.add('bg-purple-600', 'text-white', 'shadow-purple-600/30');
      event.currentTarget.classList.remove('bg-white/5', 'text-slate-300');
      renderProducts();
    }

    function updateCartBars() {
      let totalCount = 0;
      let totalPrice = 0;

      for (let [id, count] of Object.entries(cart)) {
        const item = PRODUCTS.find(p => p.id === parseInt(id));
        if (item) {
          totalCount += count;
          totalPrice += item.price * count;
        }
      }

      const badge = document.getElementById('cart-badge');
      const floatingBar = document.getElementById('floating-bar');
      const floatingCount = document.getElementById('floating-count');
      const floatingPrice = document.getElementById('floating-price');
      const modalTotal = document.getElementById('modal-total-price');

      if (totalCount > 0) {
        badge.textContent = totalCount;
        badge.classList.remove('hidden');
        floatingBar.classList.remove('hidden');
        floatingCount.textContent = totalCount;
        floatingPrice.textContent = `${totalPrice} ₽`;
        modalTotal.textContent = `${totalPrice} ₽`;
      } else {
        badge.classList.add('hidden');
        floatingBar.classList.add('hidden');
        document.getElementById('cart-drawer').classList.add('hidden');
      }
    }

    function toggleCartModal() {
      const drawer = document.getElementById('cart-drawer');
      const container = document.getElementById('cart-items-container');
      triggerHaptic('medium');

      if (drawer.classList.contains('hidden')) {
        // Build items list
        container.innerHTML = '';
        for (let [id, count] of Object.entries(cart)) {
          const item = PRODUCTS.find(p => p.id === parseInt(id));
          if (!item) continue;
          const row = document.createElement('div');
          row.className = 'flex items-center justify-between p-3 rounded-2xl bg-white/5 border border-white/5';
          row.innerHTML = `
            <div class="flex items-center gap-3">
              <img src="${item.img}" class="w-12 h-12 rounded-xl object-cover">
              <div>
                <div class="text-xs font-bold text-white">${item.title}</div>
                <div class="text-[11px] text-purple-400 font-semibold">${item.price * count} ₽</div>
              </div>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="decreaseCart(${item.id}); toggleCartModal(); toggleCartModal();" class="w-6 h-6 rounded-lg bg-white/10 text-xs flex items-center justify-center">-</button>
              <span class="text-xs font-bold">${count}</span>
              <button onclick="addToCart(${item.id}); toggleCartModal(); toggleCartModal();" class="w-6 h-6 rounded-lg bg-purple-600 text-xs flex items-center justify-center">+</button>
            </div>
          `;
          container.appendChild(row);
        }
        drawer.classList.remove('hidden');
      } else {
        drawer.classList.add('hidden');
      }
    }

    function submitOrder() {
      triggerHaptic('success');
      let orderItems = [];
      let total = 0;
      for (let [id, count] of Object.entries(cart)) {
        const item = PRODUCTS.find(p => p.id === parseInt(id));
        if (item) {
          orderItems.push(`${item.title} x${count} (${item.price * count}₽)`);
          total += item.price * count;
        }
      }

      const orderData = {
        items: orderItems,
        total: total,
        user: tg?.initDataUnsafe?.user?.first_name || 'Клиент'
      };

      if (tg) {
        tg.sendData(JSON.stringify(orderData));
      } else {
        alert(`Заказ оформлен на ${total} ₽!\n` + orderItems.join('\n'));
      }
    }

    // Initial render
    renderProducts();
  </script>
</body>
</html>
